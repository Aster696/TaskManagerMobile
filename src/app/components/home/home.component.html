@if (isLoading()) {
    <div class="loader-container">
      <ion-spinner name="dots" color="primary"></ion-spinner>
    </div>
  } @else {
    <ion-fab horizontal="end" vertical="bottom" slot="fixed">
      <ion-fab-button [routerLink]="['/add-task']">
        <ion-icon name="add"></ion-icon>
      </ion-fab-button>
    </ion-fab>
  
    <div class="accordion-s">
      <ion-accordion-group>
        @for (item of items; track $index; let index = $index) {
          <ion-accordion [value]="item">
  
            <ion-item slot="header" lines="none">
              <ion-label class="d-flex align-items-center">
                <i class="bi bi-grip-vertical fs-4 cursor-grab"></i>
              <ion-checkbox 
                (click)="$event.stopPropagation()"
                (ionChange)="$event.stopPropagation()"
                labelPlacement="end"
              >
                {{ item?.taskName || '-' }}
              </ion-checkbox>
              </ion-label>
  
              <ion-note slot="end" class="mt-1">
                <span>
                  {{ item?.date_time
                    ? (item?.date_time | date: 'dd-MM-yyyy, hh:mm')
                    : '-' }}
                </span>
              </ion-note>
            </ion-item>
  
            <div slot="content" class="ion-padding">
              <ion-text>
                {{ item?.description || '-' }}
              </ion-text>
  
              <div class="float-end w-100 mt-3">
                <ion-fab-button
                  (click)="confirmDelete(item?.id)"
                  size="small"
                  color="danger">
                  <ion-icon name="trash-outline"></ion-icon>
                </ion-fab-button>
  
                <ion-fab-button
                  [routerLink]="['/edit-task', item?.id]"
                  size="small"
                  color="primary">
                  <ion-icon name="create-outline"></ion-icon>
                </ion-fab-button>
              </div>
            </div>
  
          </ion-accordion>
        }@empty {
          <h3 class="text-center">
            No Task Set
          </h3>
        }
      </ion-accordion-group>
    </div>
  }
