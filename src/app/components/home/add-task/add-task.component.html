<div class="float-center">
  <ion-card>
    <ion-card-header>
      <ion-card-title>{{id ? 'Edit' : 'Add'}} Task</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="w-100">
          <ion-input formControlName="taskName" type="text" label="Title" labelPlacement="floating" fill="outline"></ion-input>
          <ion-text color="danger" *ngIf="form.get('taskName')?.touched && form.get('taskName')?.hasError('required')">
            Task title is required.
          </ion-text>
          
          <ion-text color="danger" *ngIf="form.get('taskName')?.touched && form.get('taskName')?.hasError('minlength')">
            Minimum 3 characters required.
          </ion-text>
        </div>
        
        <ion-textarea formControlName="description" type="text" label="Description" labelPlacement="floating" fill="outline" rows="3" class="mt-3"></ion-textarea>
        <ion-datetime-button datetime="taskDate" class="mt-3 w-100"></ion-datetime-button>
        <!-- show modal for date time -->
        <ion-modal [keepContentsMounted]="true">
          <ng-template>
            <ion-datetime
              formControlName="date_time"
              id="taskDate"
              presentation="date-time"
              [min]="minDateTime"
              [formatOptions]="{
                date: {
                  day: '2-digit',
                  month: 'long',
                  year: 'numeric'
                },
                time: {
                  hour: '2-digit',
                  minute: '2-digit',
                },
              }"
            ></ion-datetime>
          </ng-template>
        </ion-modal>
        <!-- repeat type -->
        <ion-select formControlName="repeat_type" label="Repeat" labelPlacement="floating"
        fill="outline" class="mt-3">
          <ion-select-option value="none">
            Never
          </ion-select-option>
          <ion-select-option value="daily">
            Daily
          </ion-select-option>
          <ion-select-option value="weekly">
            Weekly
          </ion-select-option>
        </ion-select>
        <!-- weekly option -->
        @if(form.get('repeat_type')?.value == 'weekly') {
          <div class="mt-3">
            @for (day of days; track day.value) {
              <ion-item>
                <ion-checkbox
                  slot="start"
                  labelPlacement="end"
                  [checked]="selectedDays.includes(day.value)"
                  (ionChange)="toggleDay(day.value, $event.detail.checked)"
                >
                  {{ day.label }}
                </ion-checkbox>
              </ion-item>
            }
          </div>
        }
        <!-- submit / cancel btn -->
        <div class="mt-3 d-flex justify-content-end gap-2 w-100">
          <ion-button (click)="onCancel()" color="danger" fill="outline" type="button">Cancel</ion-button>
          <ion-button color="primary" type="submit">Submit</ion-button>
        </div>
      </form>
    </ion-card-content>
  </ion-card>
</div>
